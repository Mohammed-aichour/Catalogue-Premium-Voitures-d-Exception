<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Car Catalogue</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* =========================================
           CONFIGURATION GLOBALE
           ========================================= */
        :root {
            --primary-color: #d4af37; /* Or Premium */
            --text-light: #ffffff;
            --text-silver: #e0e0e0;
            --glass-bg: rgba(10, 10, 10, 0.6); /* Plus transparent pour modernité */
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Poppins', sans-serif;
            color: var(--text-light);
            min-height: 100vh;
            background-color: #000;
            overflow-x: hidden; 
        }

        /* =========================================
           IMAGE DE FOND
           ========================================= */
        .bg-animation {
            position: fixed; 
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.9)), 
                        url('https://images.unsplash.com/photo-1495435229349-e86db7bfa013?q=80&w=1920&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
            z-index: -1;
            animation: smoothZoom 25s ease-out infinite alternate;
        }

        @keyframes smoothZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }

        /* =========================================
           NAVBAR
           ========================================= */
        .navbar-custom {
            padding: 15px 30px;
            backdrop-filter: blur(10px);
            background: rgba(0, 0, 0, 0.4); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .navbar-brand h2 {
            margin: 0; font-weight: 800; letter-spacing: 4px;
            font-size: 1.4rem; color: var(--text-light);
        }

        .nav-link {
            color: var(--text-light) !important;
            font-weight: 300; letter-spacing: 1px; font-size: 0.9rem;
            margin: 0 10px; transition: 0.3s;
        }

        .nav-link:hover, .nav-link.active { color: var(--primary-color) !important; }

        .btn-modern {
            padding: 8px 25px;
            background: rgba(255,255,255,0.05);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            font-weight: 500; text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem;
            transition: all 0.3s ease; text-decoration: none; display: inline-block;
        }

        .btn-modern:hover { background: var(--text-light); color: black; border-color: white; }
        
        .navbar-toggler { border-color: rgba(255,255,255,0.3); }
        .navbar-toggler-icon { background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(255, 255, 255, 0.9)' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e"); }

        @media (min-width: 1200px) {
            .navbar-brand-center { position: absolute; left: 50%; transform: translateX(-50%); }
        }
        @media (max-width: 1199px) {
            .navbar-custom { padding: 15px 20px; background: rgba(0, 0, 0, 0.85); }
            .navbar-collapse { background: rgba(10, 10, 10, 0.95); padding: 20px; border-radius: 10px; margin-top: 10px; border: 1px solid rgba(255,255,255,0.1); }
            .nav-link { margin: 10px 0; text-align: center; }
            .btn-auth-wrapper { text-align: center; margin-top: 15px; }
        }

        /* =========================================
           HERO SECTION
           ========================================= */
        .hero-section { 
            height: 75vh; 
            display: flex; align-items: center; justify-content: center; text-align: center; 
            padding: 0 20px; margin-top: 60px;
        }
        .hero-content { position: relative; z-index: 2; width: 100%; }
        
        .hero-subtitle { 
            text-transform: uppercase; letter-spacing: 8px; font-size: 0.9rem; 
            color: var(--primary-color); margin-bottom: 15px; display: block;
        }
        
        .hero-title { 
            font-size: 5.5rem; font-weight: 800; line-height: 1.1; margin-bottom: 30px; 
            text-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        .hero-title span {
            background: linear-gradient(to bottom, #fff 0%, #999 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .ticker-wrapper {
            width: 100%; max-width: 900px; overflow: hidden; margin: 0 auto 30px auto;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.03), transparent);
            padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .ticker-text {
            white-space: nowrap; animation: slide 30s linear infinite;
            font-size: 0.9rem; font-weight: 300; color: var(--text-silver); letter-spacing: 2px;
        }

        .btn-explore-speed {
            position: relative; display: inline-block;
            padding: 18px 50px;
            background: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            text-transform: uppercase; letter-spacing: 3px; font-weight: 700;
            font-size: 0.9rem; transition: all 0.4s ease; cursor: pointer;
            transform: skewX(-20deg); overflow: hidden; text-decoration: none;
        }
        .btn-explore-speed span { display: block; transform: skewX(20deg); }
        .btn-explore-speed::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: var(--primary-color); z-index: -1; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-explore-speed:hover { color: black; box-shadow: 0 0 30px rgba(212, 175, 55, 0.4); }
        .btn-explore-speed:hover::before { left: 0; }

        /* =========================================
           OPTION 2 : BANDEAU MARQUES (NEW)
           ========================================= */
        .brand-strip {
            margin-top: 40px;
            display: flex; justify-content: center; gap: 40px; align-items: center;
            opacity: 0.7;
        }
        .brand-icon {
            font-size: 2rem; color: #fff; transition: all 0.3s ease;
        }
        .brand-icon:hover {
            color: var(--primary-color); transform: translateY(-5px);
            text-shadow: 0 0 15px var(--primary-color);
        }

        /* =========================================
           OPTION 3 : SCROLL INDICATOR (NEW)
           ========================================= */
        .scroll-indicator {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 100; text-align: center;
        }
        .mouse-icon {
            width: 26px; height: 42px;
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 20px;
            position: relative;
        }
        .wheel {
            width: 4px; height: 8px; background: var(--primary-color);
            border-radius: 2px;
            position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
            animation: scrollWheel 2s infinite;
        }
        .scroll-text {
            margin-top: 8px; font-size: 0.6rem; letter-spacing: 2px; 
            text-transform: uppercase; color: rgba(255,255,255,0.5);
        }

        @keyframes scrollWheel {
            0% { top: 8px; opacity: 1; }
            100% { top: 25px; opacity: 0; }
        }

        /* =========================================
           HORLOGE LUXE (REPOSITIONNÉE)
           ========================================= */
        .dashboard-clock { 
            position: fixed; bottom: 30px; right: 40px; /* Déplacé à droite */
            z-index: 1000; width: auto; 
        }

        .clock-luxury {
            display: flex; align-items: center; gap: 15px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            padding: 10px 25px; border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 3px solid var(--primary-color);
        }

        .time-wrapper {
            font-family: 'Poppins', sans-serif; color: white; line-height: 1;
            display: flex; align-items: baseline;
        }

        #hours, #minutes { font-size: 2rem; font-weight: 500; letter-spacing: -1px; }
        .dots { font-size: 1.5rem; margin: 0 5px; color: var(--primary-color); animation: pulseDots 2s infinite; }
        
        .divider { width: 1px; height: 30px; background: rgba(255,255,255,0.2); }
        .seconds-badge { font-size: 0.8rem; color: var(--text-silver); width: 25px; text-align: center; }
        .date-text { font-size: 0.7rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .meta-wrapper { display: flex; flex-direction: column; justify-content: center; gap: 2px; }

        /* Animations */
        @keyframes fadeInUp { from { transform: translateY(40px); opacity: 0; filter: blur(5px); } to { transform: translateY(0); opacity: 1; filter: blur(0); } }
        @keyframes slide { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
        @keyframes pulseDots { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        .animate-item { opacity: 0; animation: fadeInUp 0.8s ease-out forwards; }
        .delay-1 { animation-delay: 0.3s; }
        .delay-2 { animation-delay: 0.5s; }
        .delay-3 { animation-delay: 0.7s; }
        .delay-4 { animation-delay: 0.9s; }
        .delay-5 { animation-delay: 1.1s; } /* Pour les marques */

        /* RESPONSIVE */
        @media (max-width: 1024px) { .hero-title { font-size: 4rem; } }
        @media (max-width: 768px) {
            .hero-title { font-size: 2.8rem; }
            .hero-section { height: 80vh; }
            .brand-strip { gap: 20px; }
            .brand-icon { font-size: 1.5rem; }
            .dashboard-clock { display: none; } /* On cache l'horloge sur mobile pour alléger */
            .scroll-indicator { bottom: 20px; }
        }
    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <nav class="navbar navbar-expand-xl fixed-top navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand navbar-brand-center" href="#">
                <h2>C A T A L O G U E</h2>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-xl-0">
                    <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="collection.html">Cars</a></li>
                    <li class="nav-item"><a class="nav-link" href="page-reservation.html">Reservation</a></li>
                    <li class="nav-item"><a class="nav-link" href="page-contact.html">Contact</a></li>
                </ul>
                <div class="d-none d-xl-block mx-auto" style="width: 200px;"></div>
                <div class="btn-auth-wrapper ms-auto">
                    <a href="login.html" class="btn-modern">Sign In</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="hero-section">
        <div class="hero-content">
            <p class="hero-subtitle animate-item delay-1">Exceptional & Timeless</p>
            <h1 class="hero-title animate-item delay-2">FIND YOUR <br> <span>ULTIMATE DRIVE</span></h1>
            
            <div class="ticker-wrapper animate-item delay-3">
                <div class="ticker-text">
                    <span>Available Now: Audi RS Q8 Performance — Mercedes-AMG GT 63 — Porsche 911 GT3 RS — BMW M4 CSL</span>
                </div>
            </div>
            
            <a href="collection.html" class="animate-item delay-4" style="text-decoration: none;">
                <div class="btn-explore-speed">
                    <span>Explore Collection</span>
                </div>
            </a>

            <div class="brand-strip animate-item delay-5">
                <i class="fa-brands fa-audi brand-icon" title="Audi"></i>
                <i class="fa-brands fa-mercedes brand-icon" title="Mercedes"></i>
                <i class="fa-brands fa-bmw brand-icon" title="BMW"></i>
                <i class="fa-brands fa-porsche brand-icon" title="Porsche"></i>
                <i class="fas fa-car-side brand-icon" title="More"></i>
            </div>
        </div>
    </main>

    <div class="scroll-indicator animate-item delay-5">
        <div class="mouse-icon">
            <div class="wheel"></div>
        </div>
        <div class="scroll-text">Scroll</div>
    </div>

    <div class="dashboard-clock animate-item delay-5">
        <div class="clock-luxury">
            <div class="time-wrapper">
                <span id="hours">00</span>
                <span class="dots">:</span>
                <span id="minutes">00</span>
            </div>
            <div class="divider"></div>
            <div class="meta-wrapper">
                <div class="seconds-badge" id="seconds">00</div>
                <div id="date" class="date-text">...</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('hours').textContent = String(now.getHours()).padStart(2, '0');
            document.getElementById('minutes').textContent = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('seconds').textContent = String(now.getSeconds()).padStart(2, '0');
            
            const options = { day: 'numeric', month: 'short' };
            const dateStr = now.toLocaleDateString('fr-FR', options).replace('.', '').toUpperCase();
            document.getElementById('date').textContent = dateStr;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
